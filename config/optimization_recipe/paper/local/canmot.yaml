# @package _global_
defaults:
  - /experiment: paper/local/canmot/opt
  - /bayes_opt: base_opt
  - _self_
optimization_recipe:
  name: paper/local/canmot
  mode: class_aware
  matrices: [q, r]
  seed: 42
  initial_random_points: 5
  evaluations_per_parameter: 10
  tracking_processes: 0
  ledger: ${path_join:${environment_cfg.logging_base_path},optimization,local_canmot.jsonl}
  best_result: ${path_join:${environment_cfg.logging_base_path},optimization,local_canmot_best.json}
