[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "canmot"
version = "1.0.0"
description = "CANMOT paper-reproduction code"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {text = "BSD-3-Clause"}
dependencies = [
  "bayesian-optimization==3.1.0",
  "cachetools==7.0.1",
  "descartes==1.1.0",
  "einops==0.8.2",
  "fire==0.7.1",
  "hydra-core==1.3.2",
  "lap==0.5.12",
  "matplotlib==3.5.2",
  "numba==0.63.1",
  "numpy==1.26.4",
  "opencv-python==4.8.1.78",
  "omegaconf==2.3.0",
  "pandas==1.5.3",
  "Pillow==12.1.1",
  "pyquaternion==0.9.9",
  "PyYAML==6.0.3",
  "scipy==1.15.3",
  "scikit-learn==1.7.2",
  "Shapely==1.8.5",
  "tqdm==4.67.3",
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[project.scripts]
canmot = "canmot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["canmot*", "motmetrics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
norecursedirs = ["dependencies_repos", "third_party"]
